# 持续集成：单元测试、后端冒烟、界面冒烟、联机冒烟
#
# 说明：
# - 全部跑在 windows-latest：项目依赖 BLE（winrt）和 PySide6，Windows 是主平台。
# - 不设 QT_QPA_PLATFORM=offscreen：界面冒烟会用 Win32 检查窗口可见性，
#   离屏模式下窗口不是真实窗口，这类断言必然失败。GitHub 的 Windows runner
#   有交互桌面，可以直接创建窗口。
# - 只改文档时跳过，省额度。

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: 单元测试 · Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # runner 控制台默认不是 UTF-8，脚本打印中文会 UnicodeEncodeError
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 单元测试
        run: python run_tests.py

      - name: 后端全链路冒烟
        run: python smoke_test.py

  gui:
    name: 界面与联机冒烟
    runs-on: windows-latest
    timeout-minutes: 30
    needs: unit
    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 界面全流程冒烟
        run: python tools/qt_smoke_test.py

      - name: 服务端面板冒烟
        run: python tools/server_panel_smoke_test.py

      - name: 双客户端联机冒烟
        run: python tools/room_smoke_test.py

      - name: 上传冒烟截图
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-screenshots
          path: _test_output/
          if-no-files-found: ignore
          retention-days: 7

  standalone:
    name: 构建 Linux 自包含包
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 读取版本号
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re, pathlib
          text = pathlib.Path("heartapp/__init__.py").read_text(encoding="utf-8")
          print("value=" + re.search(r'__version__\s*=\s*"([^"]+)"', text).group(1))
          PY

      - name: 下载可移植 CPython（固定版本 + 校验）
        env:
          ARCHIVE: cpython-3.12.16+20261110-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz
          SHA256: 6a9e62dad033790aef722dbd370e0ce76ce17b73627ba3ae679f537049350b39
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 600 \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20261110/${ARCHIVE}" \
            -o python.tar.gz
          echo "${SHA256}  python.tar.gz" | sha256sum -c -

      - name: 准备离线 wheel
        run: |
          set -euo pipefail
          python -m pip download -d wheelhouse --only-binary=:all: \
            --platform manylinux2014_x86_64 \
            --platform manylinux_2_28_x86_64 \
            --python-version 3.12 \
            "certbot>=5.4,<6" "websockets>=15,<16"

      - name: 构建自包含包
        run: |
          set -euo pipefail
          python tools/build_linux_standalone.py \
            --python-archive python.tar.gz \
            --sha256 6a9e62dad033790aef722dbd370e0ce76ce17b73627ba3ae679f537049350b39 \
            --wheelhouse wheelhouse \
            --version "${{ steps.version.outputs.value }}" \
            --output dist/standalone

      - name: 冒烟：解压后跑 --version 与 acme --version
        run: |
          set -euo pipefail
          cd dist/standalone
          sha256sum -c SHA256SUMS.txt
          tar -xzf ./*-linux.tar.gz
          cd heartapp-server-*
          ./runtime/heartapp-server --version
          ./runtime/heartapp-server acme --version

      - uses: actions/upload-artifact@v5
        with:
          name: linux-standalone
          path: dist/standalone/*.tar.gz
          if-no-files-found: error
          retention-days: 14
